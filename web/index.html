<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦食历 · 选餐魔盒</title>
<style>
  :root{
    --red:#DA291C; --yellow:#FFC72C; --ink:#2b2b2b; --gray:#8a8a8a;
    --line:#e8e4df; --bg:#faf8f5; --card:#fff;
    --sur:#6b4fa0; --safe:#c77d00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; line-height:1.6;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px 60px;}
  header{text-align:center; padding:26px 0 8px;}
  header h1{font-size:30px; letter-spacing:2px;}
  header h1 .dot{color:var(--red);}
  header p{color:var(--gray); font-size:14px; margin-top:6px;}
  .sub{text-align:center; color:var(--ink); font-size:15px; margin-top:2px;}
  .sub b{color:var(--red);}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:18px 16px; margin-top:14px;}
  .q{font-size:14px; font-weight:600; margin-bottom:8px;}
  .q small{color:var(--gray); font-weight:400; margin-left:6px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:#fff; color:var(--ink);
        padding:7px 14px; border-radius:999px; cursor:pointer; font-size:14px;
        user-select:none; transition:.12s;}
  .chip:hover{border-color:var(--red);}
  .chip.on{background:var(--red); border-color:var(--red); color:#fff; font-weight:600;}
  .chip.on.y{background:var(--yellow); border-color:var(--yellow); color:var(--ink);}

  details{margin-top:14px;}
  summary{cursor:pointer; font-size:13px; color:var(--gray);}
  .row{display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .row label{font-size:13px; color:var(--gray); white-space:nowrap;}
  input[type=number]{width:110px; border:1px solid var(--line); border-radius:8px;
        padding:7px 10px; font-size:14px;}

  .textline{display:flex; gap:8px; margin-top:6px;}
  input[type=text]{flex:1; border:1px solid var(--line); border-radius:10px;
        padding:10px 12px; font-size:14px;}
  .ghost{background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px;
         padding:10px 14px; font-size:14px; cursor:pointer;}
  .ghost:hover{border-color:var(--red); color:var(--red);}

  .actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:16px;
       font-weight:700; cursor:pointer; letter-spacing:2px; transition:.12s;}
  .btn.main{background:var(--red); color:#fff;}
  .btn.main:hover{filter:brightness(1.08);}
  .btn.rand{background:var(--yellow); color:var(--ink);}
  .btn.rand:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45; cursor:default;}

  #echo{display:none; margin-top:14px; background:#fff8e6; border:1px solid #f0dda8;
        border-radius:10px; padding:12px 14px; font-size:14px;}
  #echo .e-title{font-weight:600; margin-bottom:6px;}
  #echo .e-row{color:#555;}
  #echo .e-actions{margin-top:10px; display:flex; gap:10px;}
  #echo .mini{border:none; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer;}
  #echo .mini.go{background:var(--red); color:#fff;}
  #echo .mini.edit{background:#fff; border:1px solid var(--line);}

  #err{display:none; margin-top:12px; background:#fdecea; color:var(--red);
       border:1px solid #f5c6c0; border-radius:10px; padding:10px 14px; font-size:14px;}

  #loading{display:none; text-align:center; color:var(--gray); padding:26px 0; font-size:14px;}
  #meta{color:var(--gray); font-size:12.5px; margin-top:10px; text-align:center;}

  #result{display:none; margin-top:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:16px; margin-bottom:12px; position:relative;}
  .card .role{display:inline-block; color:#fff; border-radius:6px; padding:2px 10px;
              font-size:13px; font-weight:700;}
  .r-under{background:var(--red);} .r-safe{background:var(--safe);} .r-sur{background:var(--sur);}
  .card .price{font-size:26px; font-weight:800; margin-left:8px;}
  .card .name{font-size:17px; font-weight:700; margin-top:6px;}
  .card .cat{color:var(--gray); font-size:13px;}
  .card .why{margin-top:8px; font-size:14px; color:#444;}
  .card .tags{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
  .card .tag{background:#f3efe9; border-radius:6px; padding:1px 8px; font-size:12px; color:#666;}
  .card .warn{color:#b26a00; font-size:12.5px; margin-top:6px;}
  footer{margin-top:26px; text-align:center; color:var(--gray); font-size:12px;}

  @media (max-width:480px){
    header h1{font-size:25px;} .actions{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>麦麦食历<span class="dot">.</span></h1>
    <p>MCD Food Calendar</p>
  </header>
  <div class="sub">今天吃什么，让魔盒替你<b>少想一步</b>。</div>

  <div class="panel">
    <div class="q">今天怎么样？<small>可以不选</small></div>
    <div class="chips" id="chips-state">
      <span class="chip" data-k="state" data-v="累了">累了</span>
      <span class="chip" data-k="state" data-v="心情不错">心情不错</span>
      <span class="chip" data-k="state" data-v="有点低落">有点低落</span>
      <span class="chip" data-k="state" data-v="想奖励自己">想奖励自己</span>
      <span class="chip" data-k="state" data-v="就想简单解决">就想简单解决</span>
    </div>

    <div class="q" style="margin-top:16px;">想吃点什么感觉的？<small>最多两个，可不选</small></div>
    <div class="chips" id="chips-feel">
      <span class="chip" data-k="feel" data-v="满足">满足</span>
      <span class="chip" data-k="feel" data-v="热乎">热乎</span>
      <span class="chip" data-k="feel" data-v="清爽">清爽</span>
      <span class="chip" data-k="feel" data-v="甜一点">甜一点</span>
      <span class="chip" data-k="feel" data-v="想尝鲜">想尝鲜</span>
    </div>

    <div class="q" style="margin-top:16px;">有多饿？<small>可不选</small></div>
    <div class="chips" id="chips-size">
      <span class="chip" data-k="size" data-v="垫一下">垫一下</span>
      <span class="chip" data-k="size" data-v="正常">正常</span>
      <span class="chip" data-k="size" data-v="很饿">很饿</span>
    </div>

    <details>
      <summary>再准一点（预算 / 不吃什么）</summary>
      <div class="row">
        <label>预算上限</label>
        <input type="number" id="budget" min="1" max="300" step="1" placeholder="不限（¥）">
      </div>
      <div class="row">
        <label>不吃</label>
        <div class="chips" id="chips-exclude">
          <span class="chip" data-k="exclude" data-v="牛肉">牛肉</span>
          <span class="chip" data-k="exclude" data-v="辣">辣</span>
          <span class="chip" data-k="exclude" data-v="冰">冰</span>
          <span class="chip" data-k="exclude" data-v="咖啡">咖啡</span>
          <span class="chip" data-k="exclude" data-v="猪肉">猪肉</span>
          <span class="chip" data-k="exclude" data-v="鱼">鱼</span>
        </div>
      </div>
    </details>

    <div class="q" style="margin-top:16px;">或者，直接说一句话<small>例如：今天汇报搞砸了，想吃点满足的，别超过35元</small></div>
    <div class="textline">
      <input type="text" id="text" placeholder="想说就说，不想说就跳过">
      <button class="ghost" id="parseBtn">解析看看</button>
    </div>

    <div class="actions">
      <button class="btn main" id="openBtn">开 盒</button>
      <button class="btn rand" id="randBtn">随便来</button>
    </div>

    <div id="echo"></div>
    <div id="err"></div>
  </div>

  <div id="loading">正在打开魔盒…</div>
  <div id="meta"></div>
  <div id="result"></div>

  <footer>
    数据来自麦当劳官方 MCP · 价格以门店实际为准 · 忌口按名称匹配，过敏请向门店核实<br>
    本工具只负责"选"，下单请去麦当劳官方渠道
  </footer>
</div>

<script>
const S = {state:null, feels:[], size:null, excludes:[], text:"", budget:"", last:{}};

function qs(obj){
  const p = new URLSearchParams();
  for(const k in obj){ if(obj[k]!==null && obj[k]!==undefined && obj[k]!=="") p.set(k, obj[k]); }
  return p;
}

document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click", ()=>{
    const k=c.dataset.k, v=c.dataset.v;
    if(k==="state"||k==="size"){ S[k] = S[k]===v ? null : v; }
    else{
      const arr = k==="feel" ? S.feels : S.excludes;
      const i = arr.indexOf(v);
      if(i>=0){ arr.splice(i,1); }
      else{
        if(k==="feel" && arr.length>=2){ showErr("感觉最多选两个"); return; }
        arr.push(v);
      }
    }
    renderChips();
  });
});

function renderChips(){
  document.querySelectorAll(".chip").forEach(c=>{
    const k=c.dataset.k, v=c.dataset.v;
    const on = k==="state"||k==="size" ? S[k]===v
             : (k==="feel" ? S.feels : S.excludes).includes(v);
    c.classList.toggle("on", on);
  });
}

function showErr(msg){
  const e=document.getElementById("err");
  e.style.display="block"; e.textContent=msg;
}
function hideErr(){ document.getElementById("err").style.display="none"; }

function loading(on){
  document.getElementById("loading").style.display = on?"block":"none";
  document.getElementById("openBtn").disabled = on;
  document.getElementById("randBtn").disabled = on;
}

function currentParams(extra){
  const p = {
    state:S.state, feel:S.feels.join(","), size:S.size,
    budget:S.budget||undefined, exclude:S.excludes.join(","),
  };
  if(S.text) p.text = S.text;
  Object.assign(p, extra||{});
  return p;
}

async function openBox(extra){
  hideErr();
  const echo=document.getElementById("echo"); echo.style.display="none";
  const p = currentParams(extra);
  S.last = p;
  loading(true);
  try{
    const r = await fetch("/api/box?"+qs(p));
    const d = await r.json();
    if(!r.ok){ showErr(d.error||("请求失败 "+r.status)); return; }
    renderResult(d);
  }catch(e){ showErr("连不上本地服务："+e.message); }
  finally{ loading(false); }
}

document.getElementById("openBtn").addEventListener("click", ()=>openBox({}));
document.getElementById("randBtn").addEventListener("click", ()=>openBox({random:1}));
document.getElementById("budget").addEventListener("input", e=>{ S.budget=e.target.value.trim(); });
document.getElementById("text").addEventListener("input", e=>{ S.text=e.target.value.trim(); });

document.getElementById("parseBtn").addEventListener("click", async ()=>{
  hideErr();
  const text=document.getElementById("text").value.trim();
  if(!text){ showErr("先说一句，再点解析"); return; }
  const r = await fetch("/api/parse?"+qs({text}));
  const d = await r.json();
  if(!r.ok){ showErr(d.error||"解析失败"); return; }
  const echo=document.getElementById("echo");
  echo.style.display="block";
  echo.innerHTML =
    '<div class="e-title">我理解成这样，对吗？</div>' +
    d.echo.map(([k,v])=>`<div class="e-row">${k}：${v||"—"}</div>`).join("") +
    (d.unresolved.length?`<div class="e-row" style="color:#b26a00">（${d.unresolved[0]}）</div>`:"") +
    '<div class="e-actions"><button class="mini go" id="goBtn">就这样，开盒</button>' +
    '<button class="mini edit" id="editBtn">改一下</button></div>';
  document.getElementById("goBtn").addEventListener("click", ()=>{
    const f=d.fields;
    S.state=f.state||S.state; S.feels=f.feel||S.feels; S.size=f.size||S.size;
    S.budget=(f.budget_yuan!=null?f.budget_yuan:"");
    S.excludes=f.exclude||S.excludes; S.text=text;
    document.getElementById("budget").value=S.budget;
    renderChips();
    openBox({text});
  });
  document.getElementById("editBtn").addEventListener("click", ()=>{
    echo.style.display="none"; document.getElementById("text").focus();
  });
});

function renderResult(d){
  const res=document.getElementById("result");
  res.style.display="block";
  const meta=document.getElementById("meta");
  const srcLabel = d.source==="snapshot" ? "离线快照（非实时）"
                 : d.source==="cache" ? "10 分钟内的缓存" : "实时";
  meta.textContent = `${d.store.storeName} · 候选 ${d.pool_size} 个 · ${srcLabel} · 抓取于 ${d.fetched_at} · seed ${d.seed}`;

  if(!d.plans.length){
    res.innerHTML = `<div class="card">这个条件下没有可选餐品。<br>${(d.notes||[]).join("<br>")}</div>`;
    return;
  }
  res.innerHTML = d.plans.map(p=>{
    const cls = p.role==="understand"?"r-under":p.role==="safe"?"r-safe":"r-sur";
    const price = p.price_yuan!=null?`¥${p.price_yuan.toFixed(2)}`:"价格待确认";
    const tags = (p.matched||[]).map(t=>`<span class="tag">${t}</span>`).join("");
    const warns = (p.warnings||[]).map(w=>`<div class="warn">⚠ ${w}</div>`).join("");
    return `<div class="card">
      <span class="role ${cls}">${p.label}</span><span class="price">${price}</span>
      <div class="name">${p.name}</div>
      <div class="cat">${p.category}</div>
      <div class="why">${p.reason}</div>
      ${tags?`<div class="tags">${tags}</div>`:""}
      ${warns}
    </div>`;
  }).join("")
   + `<div class="actions"><button class="btn main" id="againBtn">再来一盒</button></div>`;
  document.getElementById("againBtn").addEventListener("click", ()=> openBox({}));
  window.scrollTo({top:document.getElementById("result").offsetTop-10, behavior:"smooth"});
}
</script>
</body>
</html>
